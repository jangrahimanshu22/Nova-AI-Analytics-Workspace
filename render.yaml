services:
  - type: web
    name: nova-analytics-workspace
    runtime: python
    buildCommand: "pip install -r requirements.render.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn nova.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"